name: release
# Every merge to main becomes a tagged release named after course/__init__.py,
# with the matching CHANGELOG.md section as the release notes.
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
      - run: python tools/verify.py --quiet
      - run: python tools/build_web.py --check
      - name: Resolve version
        id: v
        run: |
          echo "version=$(python tools/release.py version)" >> "$GITHUB_OUTPUT"
          python tools/release.py notes > release-notes.md
          cat release-notes.md
      - name: Tag and publish release (skipped if the tag exists)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "tag v$VERSION already exists; nothing to do"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --notes-file release-notes.md
